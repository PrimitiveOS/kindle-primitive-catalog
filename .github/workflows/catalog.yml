name: catalog
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install jsonschema==4.26.0 'Pillow>=12,<14'
      - name: Test the catalog and build the site
        run: |
          sh scripts/test.sh
          python3 -I scripts/build-index.py
      - name: Check that the schema folder matches the umbrella repo
        run: |
          git clone --depth 1 https://github.com/DoanNguyenTrong/kindle-primitive.git "$RUNNER_TEMP/umbrella"
          for f in app manifest index; do cmp "schema/$f.schema.json" "$RUNNER_TEMP/umbrella/schema/$f.schema.json"; done
      - name: Verify live assets, manifests and archive contents
        run: python3 -I scripts/check-assets.py --deep
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          path: site
  pages:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deploy
        uses: actions/deploy-pages@v4
