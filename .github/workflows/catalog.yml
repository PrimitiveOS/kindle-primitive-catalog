name: catalog
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema==4.26.0
      - name: Check every listing and build the index
        run: sh scripts/test.sh
      - name: Check the published assets (download, size, SHA-256)
        run: python3 -I scripts/check-assets.py
      - name: Check that the schema folder matches the umbrella repo
        run: |
          git clone --depth 1 https://github.com/DoanNguyenTrong/kindle-primitive.git /tmp/umbrella
          for f in app manifest index; do cmp schema/$f.schema.json /tmp/umbrella/schema/$f.schema.json; done
  pages:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema==4.26.0
      - run: python3 -I scripts/build-index.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
